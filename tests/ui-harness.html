<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slop Drift · UI harness</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1118; }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #app { position: fixed; inset: 0; }
      .hx {
        position: fixed;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        width: 188px;
        max-height: 70vh;
        overflow: auto;
        padding: 8px;
        border-radius: 10px;
        background: rgba(20, 0, 40, 0.82);
        border: 1px dashed rgba(255, 120, 255, 0.6);
        color: #f6e9ff;
        font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
      }
      .hx.is-collapsed > :not(.hx-head) { display: none; }
      .hx-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-weight: 700; }
      .hx button, .hx select { font: inherit; color: inherit; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 5px; padding: 3px 5px; margin: 1px; cursor: pointer; }
      .hx-group { margin: 6px 0 2px; color: #d9a6ff; font-weight: 700; }
      .hx pre { margin: 4px 0 0; white-space: pre-wrap; font-size: 10px; color: #bff; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <main id="app"></main>
    <aside class="hx" id="harness" aria-label="Harness controls">
      <div class="hx-head"><span>UI HARNESS</span><button type="button" data-h="collapse">–</button></div>
      <div class="hx-group">Screens</div>
      <button type="button" data-h="loading">Loading</button>
      <button type="button" data-h="menu">Menu</button>
      <button type="button" data-h="race">Race</button>
      <button type="button" data-h="pause">Pause</button>
      <button type="button" data-h="finish">Finish</button>
      <button type="button" data-h="finish-drift">Finish drift</button>
      <button type="button" data-h="settings">Settings</button>
      <div class="hx-group">Mode</div>
      <select data-h="mode"></select>
      <div class="hx-group">Events</div>
      <button type="button" data-h="wrongway">Wrong way</button>
      <button type="button" data-h="offroad">Off road</button>
      <button type="button" data-h="toast-info">Toast</button>
      <button type="button" data-h="toast-good">Good</button>
      <button type="button" data-h="toast-warn">Warn</button>
      <button type="button" data-h="debug">Debug</button>
      <button type="button" data-h="touch">Force touch UI</button>
      <button type="button" data-h="manual">Manual shift</button>
      <div class="hx-group">Career / online</div>
      <button type="button" data-h="name-prompt">Name prompt</button>
      <button type="button" data-h="notify">Notify ×5</button>
      <button type="button" data-h="conn">Connection</button>
      <button type="button" data-h="daily-done">Daily done</button>
      <button type="button" data-h="lb-status">LB status</button>
      <button type="button" data-h="ghost">Ghost chip</button>
      <button type="button" data-h="leaderboard">Leaderboard</button>
      <button type="button" data-h="garage">Garage</button>
      <button type="button" data-h="achievements">Achievements</button>
      <div class="hx-group">Backdrop</div>
      <button type="button" data-h="bg-snow">Snow</button>
      <button type="button" data-h="bg-forest">Forest</button>
      <button type="button" data-h="bg-mixed">Mixed</button>
      <div class="hx-group">Checks</div>
      <button type="button" data-h="selftest">DOM-write test</button>
      <pre id="hx-out"></pre>
    </aside>
    <script type="module" src="./ui-harness.js"></script>
  </body>
</html>
