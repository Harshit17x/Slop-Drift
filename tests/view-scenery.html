<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scenery and atmosphere viewer</title>
    <style>
      #panel { position: fixed; top: 8px; left: 8px; z-index: 2; display: flex; gap: 6px; align-items: center; font: 12px ui-monospace, monospace; color: #fff; text-shadow: 0 1px 2px #000; }
      #panel button { font: inherit; padding: 4px 8px; }
      #info { white-space: pre; }
    </style>
  </head>
  <body>
    <div id="panel">
      <button data-tod="dawn">dawn</button><button data-tod="day">day</button><button data-tod="sunset">sunset</button><button data-tod="night">night</button>
      <button data-quality="Low">Low</button><button data-quality="High">High</button><button data-quality="Ultra">Ultra</button>
      <span id="info">building…</span>
    </div>
    <script type="module" src="./view-scenery.js"></script>
  </body>
</html>
