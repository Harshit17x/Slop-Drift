<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Net check</title>
  <style>
    body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #10161b; color: #e8eef2; }
    .row { display: flex; gap: 8px; padding: 8px; flex-wrap: wrap; }
    iframe { flex: 1 1 320px; height: 330px; border: 1px solid #2c3a44; border-radius: 6px; background: #0b1014; }
    #summary { padding: 8px 12px; font-weight: 700; }
    canvas { display: block; width: 100%; height: 180px; }
    pre { margin: 0; padding: 6px 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <script type="module">
    import { NetClient } from '/src/net/NetClient.js';
    import { Leaderboard } from '/src/net/Leaderboard.js';

    const params = new URLSearchParams(location.search);
    const child = params.get('child');
    // ?host=127.0.0.1:8787 runs the same check against `npx wrangler dev` (online mode).
    const host = params.get('host') || '';
    const run = params.get('run') || Date.now().toString(36);

    if (!child) {
      // Parent: two iframes, each a separate NetClient in local (BroadcastChannel) mode.
      document.body.insertAdjacentHTML('afterbegin', `<div id="summary">waiting...</div><div class="row"><iframe id="a" src="?child=A&host=${encodeURIComponent(host)}&run=${run}"></iframe><iframe id="b" src="?child=B&host=${encodeURIComponent(host)}&run=${run}"></iframe></div>`);
      const summary = document.getElementById('summary');
      const report = {};
      window.addEventListener('message', (event) => {
        if (!event.data?.netCheck) return;
        report[event.data.netCheck] = event.data;
        const a = report.A;
        const b = report.B;
        const ok = a && b && a.sees === 'Driver B' && b.sees === 'Driver A' && a.sampled && b.sampled && a.cars === 1 && b.cars === 1;
        window.netCheck = { ok, a, b };
        summary.textContent = ok ? 'PASS: each client sees the other (roster, interpolated state, rendered car)' : `waiting... ${JSON.stringify({ a: a?.sees, b: b?.sees })}`;
      });
    } else {
      document.body.insertAdjacentHTML('afterbegin', '<canvas id="view"></canvas><pre id="log"></pre>');
      const log = document.getElementById('log');
      const THREE = await import('three');
      const { RemotePlayers } = await import('/src/render/RemotePlayers.js');

      const profile = { id: host ? `view-net-${child}-${run}` : `view-net-${child}-0000`, name: `Driver ${child}`, level: child === 'A' ? 3 : 8, cosmetics: { paint: child === 'A' ? 'ember' : 'glacier', rim: 'gold', number: '7' } };
      const net = new NetClient({ host, profile });
      const board = new Leaderboard({ host, profile });
      net.join('sprint');

      const canvas = document.getElementById('view');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a2630);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
      const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth / canvas.clientHeight, 0.1, 500);
      camera.position.set(0, 18, 26);
      camera.lookAt(0, 0, 0);
      const remotes = new RemotePlayers({ scene, net });

      const state = {
        position: new THREE.Vector3(), quaternion: new THREE.Quaternion(), velocity: new THREE.Vector3(),
        speed: 12, forwardSpeed: 12, steerAngle: 0.25, gear: 2,
      };
      const phase = child === 'A' ? 0 : Math.PI;
      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      let sampled = false;
      let last = performance.now();
      let lastPost = 0;
      const top = await board.top('sprint', 10);

      function frame(now) {
        const t = now / 1000;
        const a = t * 0.8 + phase;
        state.position.set(Math.cos(a) * 10, 0, Math.sin(a) * 10);
        state.velocity.set(-Math.sin(a) * 8, 0, Math.cos(a) * 8);
        state.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -a);
        net.sendState(state, { braking: false, drifting: true }, now);
        for (const id of net.peers.keys()) if (net.samplePeer(id, now, pos, quat)) sampled = true;
        remotes.update((now - last) / 1000, camera, now);
        last = now;
        renderer.render(scene, camera);
        if (now - lastPost > 250) {
          lastPost = now;
          const peer = [...net.peers.values()][0];
          const sees = peer?.name ?? null;
          log.textContent = [
            `${profile.name}  mode=${net.mode}  status=${net.status}`,
            `peers: ${[...net.peers.values()].map((p) => `${p.name} (LV ${p.level}, ${p.paint})`).join(', ') || 'none'}`,
            `sent ${net.stats.sent} packets, received ${net.stats.received}, delay ${peer ? net.peerDelay(peer.id)?.toFixed(0) : '-'} ms`,
            `sampled peer pose: ${sampled ? `${pos.x.toFixed(1)}, ${pos.z.toFixed(1)}` : 'no'}   remote cars: ${remotes.count}`,
            `leaderboard: ${top.status}, ${top.entries.length} entries`,
          ].join('\n');
          parent.postMessage({ netCheck: child, mode: net.mode, status: net.status, sees, sampled, cars: remotes.count, received: net.stats.received }, '*');
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
