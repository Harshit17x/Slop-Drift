<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Slop-Drift — Mountain Drift Racing</title>
    <meta name="description" content="Drift a rally car around a procedural mountain: a 5.7 km loop, a summit hill climb and a touge descent, in your browser." />
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1418; }
      #app { position: relative; }
      .game-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
      .fatal-error { position: absolute; inset: 0; z-index: 50; display: grid; place-content: center; gap: 8px; padding: 24px; background: #0b1418; color: #f4f7f3; font-family: system-ui, sans-serif; text-align: center; }
      .fatal-error h2 { margin: 0; color: #c7ff52; }
      .fatal-error p { margin: 0; max-width: 52ch; color: #b8c8c7; }
    </style>
    <!-- CrazyGames SDK v3 -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <!-- Lets the game run from any static file server without a build step. Vite ignores this and bundles three itself. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
